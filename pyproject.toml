[project]
name = "llm-proxy"
version = "0.1.0"
description = "Cursor-compatible DeepSeek proxy with reasoning compatibility"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "httpx",
  "uvicorn[standard]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
