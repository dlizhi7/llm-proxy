services:
  llm-proxy:
    build: .
    image: llm-proxy:latest
    container_name: llm-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Quick Tunnel: random *.trycloudflare.com URL on each container recreate.
  # See cloudflared/README.md for switching to a fixed domain later.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://llm-proxy:8080
    depends_on:
      llm-proxy:
        condition: service_healthy
